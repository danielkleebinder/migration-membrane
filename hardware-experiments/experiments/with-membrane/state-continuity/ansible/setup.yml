---
# STEP 1: Global fact gathering
- name: Gather Facts from All Nodes
  hosts: all
  gather_facts: true

# STEP 2: Prepare satellite nodes
- name: Prepare Satellite Nodes
  hosts: satellites
  tasks:
    - name: Create uniform simulation directories
      ansible.builtin.file:
        path: "/home/pi/iot-2026/experiments/with-membrane/state-continuity"
        state: directory
        mode: "0777"
        owner: pi

    - name: Reset log files
      ansible.builtin.file:
        path: "/home/pi/iot-2026/experiments/with-membrane/state-continuity/iwasm.log"
        state: absent

    - name: Copy assets to satellites
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "/home/pi/iot-2026/experiments/with-membrane/state-continuity/{{ item | basename }}"
        mode: "0755"
      loop:
        - benchmark.wasm
        - benchmark.c
        - iwasm-arm64

# STEP 3.1: Configure Traffic Control on Sat1
- name: Configure Network Emulation on Sat1
  hosts: sat1
  become: true
  tasks:
    - name: Clear any existing root qdisc configurations
      ansible.builtin.command: tc qdisc del dev eth0 root
      ignore_errors: true
      changed_when: false

    - name: Establish root classful HTB framework
      ansible.builtin.command: "tc qdisc add dev eth0 root handle 1: htb default 1"

    - name: Define Class 1:1 for Satellite Link
      ansible.builtin.command: "tc class add dev eth0 parent 1: classid 1:1 htb rate 10gbit"

    - name: Apply Sat1 to Sat2 Netem Profile
      ansible.builtin.command: "tc qdisc add dev eth0 parent 1:1 handle 10: netem delay 3.5ms 0.1ms distribution paretonormal loss 0.01%"

    - name: Bind Sat2 Destination IP Filter to Class 1:1
      ansible.builtin.command: "tc filter add dev eth0 protocol ip parent 1:0 prio 1 u32 match ip dst 192.168.10.12 flowid 1:1"

# STEP 3.2: Configure Traffic Control on Sat2
- name: Configure Network Emulation on Sat2
  hosts: sat2
  become: true
  tasks:
    - name: Clear any existing root qdisc configurations
      ansible.builtin.command: tc qdisc del dev eth0 root
      ignore_errors: true
      changed_when: false

    - name: Establish root classful HTB framework
      ansible.builtin.command: "tc qdisc add dev eth0 root handle 1: htb default 1"

    - name: Define Class 1:1 for Satellite Link
      ansible.builtin.command: "tc class add dev eth0 parent 1: classid 1:1 htb rate 10gbit"

    - name: Apply Sat2 to Sat1 Netem Profile
      ansible.builtin.command: "tc qdisc add dev eth0 parent 1:1 handle 10: netem delay 3.5ms 0.1ms distribution paretonormal loss 0.01%"

    - name: Bind Sat1 Destination IP Filter to Class 1:1
      ansible.builtin.command: "tc filter add dev eth0 protocol ip parent 1:0 prio 1 u32 match ip dst 192.168.10.11 flowid 1:1"

# STEP 4: Start the Receiver Container on Sat1 FIRST
- name: Start Receiver on Sat1
  hosts: sat1
  tasks:
    - name: Start receiver on sat1
      ansible.builtin.shell: "stdbuf -oL ./iwasm-arm64 --migration-server=8010 benchmark.wasm > /home/pi/iot-2026/experiments/with-membrane/state-continuity/iwasm.log 2>&1"
      args:
        chdir: /home/pi/iot-2026/experiments/with-membrane/state-continuity
      async: 600
      poll: 0

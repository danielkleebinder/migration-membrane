# STEP 6: Start Receiver on Sat1
- name: Start Receiver on Sat1
  hosts: sat1
  tasks:
    - name: Start receiver on sat1
      ansible.builtin.shell: "stdbuf -oL ./iwasm-arm64 --addr-pool=0.0.0.0/0 --migration-server=8010 benchmark.wasm > /home/pi/iot-2026/experiments/with-membrane/macro/iwasm.log 2>&1"
      args:
        chdir: /home/pi/iot-2026/experiments/with-membrane/macro
      async: 1200
      poll: 0

# STEP 7: Start Sender stream on Sensor
- name: Start Sender on Sensor
  hosts: sensor
  tasks:
    - name: Run sender.py asynchronously
      ansible.builtin.shell: "python3 /home/pi/iot-2026/experiments/with-membrane/macro/sender.py > /home/pi/iot-2026/experiments/with-membrane/macro/sender.log 2>&1"
      args:
        chdir: /home/pi/iot-2026/experiments/with-membrane/macro
      async: 1200
      poll: 0

# STEP 8: Run Orchestrated Simulation
- name: Perform Continuous Migration Simulation
  hosts: localhost
  connection: local
  tasks:
    - name: Run simulation asynchronously
      ansible.builtin.shell: "python3 ../animate_orbits.py > experiment-orchestrator.log 2>&1"
      async: 1200
      poll: 0

    - name: Pause Ansible to let the Simulation run
      ansible.builtin.pause:
        seconds: 900

# STEP 9: Cleanup Sensor and Fetch Results
- name: Cleanup sensor and retrieve results
  hosts: sensor
  become: true
  tasks:
    - name: Kill sender script and tcpdump
      ansible.builtin.command: >
        pkill -2 -f "{{ item }}"
      loop:
        - sender.py
      ignore_errors: true

    - name: Wait for Python script to finish draining and writing CSV
      ansible.builtin.pause:
        seconds: 60

    - name: Collect results.csv back to the local host machine
      ansible.builtin.fetch:
        src: /home/pi/iot-2026/experiments/with-membrane/macro/results.csv
        dest: ./results.csv
        flat: true
      ignore_errors: true


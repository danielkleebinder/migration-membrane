---
# STEP 1: Global fact gathering
- name: Gather Facts from All Nodes
  hosts: all
  gather_facts: true

# STEP 2: Prepare satellite nodes
- name: Prepare Satellite Nodes
  hosts: satellites
  tasks:
    - name: Create uniform simulation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
        owner: pi
      loop:
        - /home/pi/iot-2026/experiments/with-membrane/macro

    - name: Reset log files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /home/pi/iot-2026/experiments/with-membrane/macro/iwasm.log
        - /home/pi/iot-2026/experiments/with-membrane/macro/migration_traffic.pcap
        - /home/pi/iot-2026/experiments/with-membrane/macro/app_traffic.pcap
        - /home/pi/iot-2026/experiments/with-membrane/macro/cpu_ram_metrics.log

    - name: Copy assets to satellites
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/home/pi/iot-2026/experiments/with-membrane/macro/{{ item | basename }}"
        mode: "0755"
        owner: pi
      loop:
        - benchmark.wasm
        - iwasm-arm64

# STEP 3: Prepare sensor node to send XR packets
- name: Prepare Sensor Node
  hosts: sensor
  tasks:
    - name: Create uniform simulation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
        owner: pi
      loop:
        - /home/pi/iot-2026/experiments/with-membrane/macro

    - name: Reset sensor log files
      ansible.builtin.file:
        path: /home/pi/iot-2026/experiments/with-membrane/macro/sensor_app_traffic.pcap
        state: absent

    - name: Reset log files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /home/pi/iot-2026/experiments/with-membrane/macro/results.csv
        - /home/pi/iot-2026/experiments/with-membrane/macro/sender.log
        - /home/pi/iot-2026/experiments/with-membrane/macro/sensor_app_traffic.pcap

    - name: Copy sender assets to sensor
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/home/pi/iot-2026/experiments/with-membrane/macro/{{ item | basename }}"
        mode: "0755"
        owner: pi
      loop:
        - sender.py
        - 50mbps_su_dcf_full.csv



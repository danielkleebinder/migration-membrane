# STEP 11: Cleanup Localhost Simulation
- name: Cleanup Local Orchestrator
  hosts: localhost
  tasks:
    - name: Kill simulation script on localhost
      ansible.builtin.command: >
        pkill -2 -f animate_orbits.py
      ignore_errors: true